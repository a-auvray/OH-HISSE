name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Installer Python et les dépendances
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy app tests scripts
      - name: Tests
        run: uv run pytest --cov=app --cov-report=term-missing
      - name: Migrations à jour avec les modèles
        env:
          OH_HISSE_URL_BASE_DE_DONNEES: sqlite:///./ci.db
        run: |
          uv run alembic upgrade head
          uv run alembic check

  frontend:
    name: Frontend (format, lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: npm ci
      - name: Types de l'API à jour avec le backend
        run: |
          mkdir -p node_modules/.tmp
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts est périmé : lancer « npm run api:types » et commiter."
            exit 1
          }
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    name: Image Docker (construction, démarrage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        run: docker build -t oh-hisse .
      - name: Démarrer et vérifier l'API et l'interface
        run: |
          docker run -d --name oh-hisse -p 8000:10000 \
            -e PORT=10000 \
            -e OH_HISSE_CLE_SECRETE="$(openssl rand -hex 32)" \
            -e OH_HISSE_URL_BASE_DE_DONNEES=sqlite:////tmp/oh-hisse.db \
            oh-hisse
          for i in $(seq 30); do curl -fs localhost:8000/api/sante && break; sleep 1; done
          curl -fs localhost:8000/api/sante | grep -q '"statut":"ok"'
          curl -fs localhost:8000/ | grep -q 'id="root"'
          curl -fs localhost:8000/marine/carte | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/inconnue)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/auth/demo)" = 201
      - name: Journal du conteneur
        if: always()
        run: docker logs oh-hisse
